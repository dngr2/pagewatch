name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Tests
        run: python -m pytest tests/ -q

      # The demo is the thing buyers actually run, so CI runs it too — a broken
      # demo is a broken first impression.
      - name: Demo still works
        run: python -m pagewatch --demo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t pagewatch:ci .
      - name: Run demo in container
        run: docker run --rm pagewatch:ci --demo
